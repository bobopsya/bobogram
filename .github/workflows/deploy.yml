name: Deploy

# Каждый пуш в main: настроить Supabase (таблицы, вход, серверная функция) и опубликовать сайт.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Setup Supabase
        id: supabase
        run: node scripts/supabase-setup.mjs
        env:
          # Единственный нужный секрет: Settings → Secrets and variables → Actions
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # ID проекта Supabase (не секретный); можно переопределить секретом SUPABASE_PROJECT_REF
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'mvtwwegtvcmgwtggnbjb' }}
          # Свой TURN-сервер для звонков (docs/SETUP.md → «Звонки»)
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          TURN_HOST: ${{ vars.TURN_HOST || '78.17.112.164' }}
          # Адрес сайта (свой домен: Settings → Pages → Custom domain)
          SITE_URL: ${{ vars.SITE_URL || 'https://bobogram.org/' }}
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
